# IRIS BizTalk Portal — CI
# req: TEST-PLAN-LOGIN §5 (3-stage security hook), §2 (coverage), T-L1-03, T-L1-20
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # L1 — secret scanning.
  # req: RISK-L02, NFR-SEC-SECRET-L01, CONST-SEC-L02
  # 레거시 apc_login_proc_act.jsp 에 Kakao sender_key 와 개인 휴대폰번호 3건이
  # 하드코딩되어 있었다. 이 job 은 그 부류의 결함이 다시 들어오는 것을 막는다.
  # The legacy had a Kakao sender_key and three personal mobile numbers hardcoded in
  # source. This job exists so that class of defect cannot return.
  # ---------------------------------------------------------------------------
  secrets:
    name: L1 secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          # VS-006 수정. 패키지가 배포하는 룰셋을 명시한다. 지정하지 않으면 기본 룰만
          # 적용되어, 저장소에 체크인된 커스텀 룰이 L1·CI 어디에서도 쓰이지 않는다.
          # VS-006: name the shipped ruleset explicitly; without it only the built-in rules run
          # and the checked-in custom rules are used nowhere.
          config-path: hooks/gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build, unit tests and coverage gates.
  # req: TEST-PLAN-LOGIN §2 — 80% line / 70% branch overall, 95% for crypto+domain
  # ---------------------------------------------------------------------------
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Unit tests and coverage gates
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ---------------------------------------------------------------------------
  # Static rules that encode the legacy's specific failures.
  # req: RISK-L03 — the "disabled controls" pattern
  # 이 job 은 일반적인 린트가 아니다. 레거시에서 실제로 발생한 결함을 직접 겨냥한다.
  # This is not generic linting: each rule targets a defect that actually occurred.
  # ---------------------------------------------------------------------------
  static-rules:
    name: L2 static rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 주석 제외 필터 / comment-exclusion filter.
      #
      # 이 코드베이스는 레거시 결함을 Javadoc 으로 문서화한다 — 예: PasswordHasher 는
      # `JexMessageDigest.getHashString(SHA_256, pwd)` 를 인용해 무엇을 대체했는지 설명한다.
      # 필터 없이 검사하면 결함을 설명하는 문서가 빌드를 깨뜨린다. 실제 코드 라인만 본다.
      #
      # This codebase documents legacy defects in Javadoc — PasswordHasher quotes
      # `JexMessageDigest.getHashString(SHA_256, pwd)` to explain what it replaced.
      # Without this filter, documentation of a defect would fail the build. Code lines only.
      - name: Define code-only grep helper
        run: |
          cat > /tmp/codegrep.sh <<'SH'
          #!/usr/bin/env bash
          # usage: codegrep.sh <extended-regex> <path>
          grep -rniE --include='*.java' "$1" "$2" \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)' || true
          SH
          chmod +x /tmp/codegrep.sh

      # req: FR-LOGIN-005, L2 — no weak password hashing may reappear
      #
      # 규칙을 좁힌 이유 / why this rule is narrow:
      #   초기 규칙은 `MessageDigest`+`SHA-256` 을 무조건 차단했고, 두 번 오탐했다:
      #     ① PasswordHasher 의 Javadoc — 무엇을 대체했는지 설명하는 문장 (SR-02)
      #     ② MessageHistoryService — 감사 기록용 전화번호 해시 (SR-06, ADR-006 요구사항)
      #   SHA-256 자체가 문제인 것이 아니다. <b>비밀번호 저장</b>에 쓰는 것이 문제다.
      #   따라서 자격증명 문맥에서만 차단하고, MD5 는 용도와 무관하게 전면 차단한다.
      #
      #   The first version blocked any MessageDigest+SHA-256 and produced two false positives:
      #   Javadoc explaining what was replaced (SR-02), and a legitimate audit hash of phone
      #   search terms required by ADR-006 (SR-06). SHA-256 is not the problem; using it for
      #   password storage is. So the rule fires only in a credential context, while MD5 is
      #   rejected outright since it has no legitimate use in this codebase.
      - name: Reject MD5 anywhere
        run: |
          hits=$(/tmp/codegrep.sh '(MessageDigest|getHashString|getInstance)[^;]*MD5' src/main/java)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::MD5 detected (legacy defect L2). It has no legitimate use here."
            exit 1
          fi

      - name: Reject SHA-256 in a credential context
        run: |
          hits=$(/tmp/codegrep.sh '(MessageDigest|getHashString)[^;]*(SHA[-_]?256).*(password|pwd|credential)' src/main/java)
          hits="$hits$(/tmp/codegrep.sh '(password|pwd|credential)[^;]*(MessageDigest|getHashString)[^;]*SHA[-_]?256' src/main/java)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::SHA-256 used on credential material (legacy defect L2). Use Argon2id."
            exit 1
          fi

      # req: NFR-SEC-LOG-L01, TM-L014 — the legacy logged email, session id and IP at debug
      - name: Reject logging of credential or session material
        run: |
          hits=$(/tmp/codegrep.sh 'log\.(debug|info|warn|error)\([^)]*(password|pwd|otpKey|otp_key|sessionId|session_id)' src/main/java)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Potential credential or session material in a log statement (NFR-SEC-LOG-L01)."
            exit 1
          fi

      # req: FR-LOGIN-019, L7 — the legacy trusted X-Forwarded-For and HTTP_VIA from the client
      - name: Reject direct reads of client-controlled IP headers
        run: |
          hits=$(/tmp/codegrep.sh 'getHeader\([[:space:]]*"(X-Forwarded-For|HTTP_VIA|HTTP_CLIENT_IP|Proxy-Client-IP)"' src/main/java)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Client-controlled IP header read directly (legacy defect L7). Resolve at the trusted proxy boundary."
            exit 1
          fi

      # req: FR-OTP-004, L4 — the legacy sent the OTP secret to chart.apis.google.com over HTTP
      - name: Reject external QR or OTP secret transmission
        run: |
          hits=$(/tmp/codegrep.sh 'chart\.apis\.google\.com|chart\?cht=qr' src/main/java)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::OTP secret would be transmitted to a third party (legacy defect L4)."
            exit 1
          fi

      # req: RISK-L02, CONST-SEC-L02 — the legacy hardcoded three personal mobile numbers
      - name: Reject literal mobile numbers
        run: |
          hits=$(/tmp/codegrep.sh '"01[0-9]{8,9}"' src/main/java)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Literal mobile number in source (legacy defect L1). Move to configuration."
            exit 1
          fi

      # req: D-A24, RISK-A03, CONST-SEC-L02 — the legacy hardcoded the Kakao sender profile key
      #      in two JSPs (biztalk_admin_50_s001_act.jsp and its sibling), and that key is now
      #      compromised. SenderProfileKeyResolver rejects the leaked value by SHA-256, but a
      #      hash comparison cannot stop a *different* key from being pasted into source.
      #      이 규칙이 그것을 막는다 / this rule does.
      #
      #      규칙이 좁은 이유 / why the rule is narrow: `COMPROMISED_KEY_SHA256` 는 의도적으로
      #      커밋된 해시이고 `ProfileKey.REDACTED` 는 마스킹 문자열이다. 둘 다 자격증명이
      #      아니므로 이름 기준으로 제외한다.
      #      `COMPROMISED_KEY_SHA256` is a deliberately committed hash and `ProfileKey.REDACTED`
      #      is the masking string. Neither is credential material, so both are excluded by name.
      - name: Reject sender profile key literals
        run: |
          hits=$(/tmp/codegrep.sh '(sender_key|senderkey|profile_key|profilekey)[a-z0-9_]*[[:space:]]*=[[:space:]]*"[^"]{16,}"' src/main/java \
            | grep -viE 'SHA256|REDACTED|SYNTHETIC' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Sender profile key literal in source (legacy defect D-A24). Inject via IRIS_ATK_PROFILE_KEY_*."
            exit 1
          fi

      # req: D-A30, NFR-SEC-LOG-A01, harness §10 — 실데이터 평문 로그 금지 / no PII in plaintext logs
      #      레거시는 발송마다 sender_key 와 수신번호를 그대로 기록했다.
      #      The legacy wrote the sender_key and the recipient number to the log on every send.
      #
      #      ProfileKey 와 RecipientNumber 는 toString()·@JsonValue 가 <b>마스킹된</b> 형태를
      #      돌려주므로 값 객체를 로그에 넘기는 것은 안전하다. 위험한 것은 원시 접근자
      #      `exposeForVendorCall()` 하나뿐이다 — 그래서 그것만 겨냥한다.
      #      Passing the value objects to a log is safe: toString() and @JsonValue both return the
      #      masked form. Exactly one accessor returns the raw value, so the rule targets it.
      - name: Reject unmasked credential or PII in log statements
        run: |
          hits=$(/tmp/codegrep.sh 'log\.(trace|debug|info|warn|error)\([^;]*exposeForVendorCall' src/main/java)
          hits="$hits$(/tmp/codegrep.sh 'log\.(trace|debug|info|warn|error)\([^;]*(senderKey|sender_key|profileKey|profile_key)[[:space:]]*[,)+]' src/main/java)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Unmasked profile key or recipient in a log statement (legacy defect D-A30)."
            exit 1
          fi

      # req: FR-AZ-A05, T-A2 — the raw accessor must not spread beyond the vendor boundary.
      #      마스킹은 기본값일 때만 유효하다. `exposeForVendorCall()` 이 화면·API·로그로
      #      퍼지면 마스킹은 선택 사항이 되고, 선택 사항인 통제는 언젠가 선택되지 않는다.
      #      Masking only holds while it is the default. If the raw accessor spreads into the API or
      #      the UI layer, masking becomes optional — and an optional control is eventually not chosen.
      - name: Confine the raw PII accessor to the vendor boundary
        run: |
          hits=$(/tmp/codegrep.sh 'exposeForVendorCall' src/main/java \
            | grep -vE '^src/main/java/com/webcash/iris/biztalk/alimtalk/(domain/(ProfileKey|RecipientNumber)\.java|infra/vendor/)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::exposeForVendorCall() used outside domain/ProfileKey, domain/RecipientNumber and infra/vendor (FR-AZ-A05)."
            exit 1
          fi

      # req: ADR-007, CONST-SEC-L02, SEC-A02 — no secret value in a configuration resource.
      #
      # 이 규칙이 존재하는 이유는 실제로 일어났기 때문이다. `application.yml` 은 머리말에
      # *"시크릿은 이 파일에 두지 않는다 … 아래 자리표시자에는 의도적으로 기본값이 없다"* 고
      # 적어 두었는데, 같은 파일 안에 운영 DB 비밀번호가 평문으로, 그리고 AES-256-GCM 키가
      # `${VAR:default}` 기본값으로 들어 있었다. 후자는 세 줄 위에 "NO DEFAULT" 라고 적힌
      # 바로 아래였다. 주석은 이런 것을 막지 못한다 — 빌드가 막아야 한다.
      #
      # This rule exists because it happened. `application.yml` states in its header that no secret
      # belongs in it and that the placeholders deliberately carry no defaults — while holding a
      # production database password in clear and an AES-256-GCM key as a `${VAR:default}` fallback,
      # the latter three lines below a comment reading "NO DEFAULT". Comments do not prevent this; a
      # build does.
      #
      # 자리표시자(`CHANGE_ME`)와 예시 파일은 제외한다 / placeholders and example files are excluded.
      - name: Reject secret values in configuration resources
        run: |
          files=$(find src/main/resources -name 'application*.yml' ! -name '*.example' 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          hits=""
          for f in $files; do
            # ① 시크릿 성격의 키에 리터럴 값 / a literal value on a secret-shaped key
            hits="$hits$(grep -nHiE '^[[:space:]]*(password|secret-key|secretkey|private-key|api-key|apikey|token|sender-key)[[:space:]]*:[[:space:]]*[^$#[:space:]]' "$f" \
              | grep -viE 'CHANGE_ME|__|<.*>' || true)"
            # ② 시크릿 성격의 키에 ${VAR:default} 기본값 / a ${VAR:default} fallback on one
            hits="$hits$(grep -nHiE '^[[:space:]]*(password|secret-key|secretkey|private-key|api-key|apikey|token|sender-key)[[:space:]]*:[[:space:]]*\$\{[A-Z_0-9]+:[^}[:space:]]' "$f" || true)"
            # ③ 자격증명이 박힌 JDBC URL / credentials embedded in a JDBC URL
            hits="$hits$(grep -nHiE '^[[:space:]]*url[[:space:]]*:[[:space:]]*jdbc:[^$]*(user|password)=' "$f" || true)"
          done
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Secret value or defaulted secret in a configuration resource (SEC-A02). Inject it, and leave no default."
            exit 1
          fi

      # req: harness §5 — every method carries provenance
      - name: Require source or req provenance comments
        run: |
          missing=0
          for f in $(find src/main/java -name '*.java'); do
            if ! grep -qE '// (source|req):' "$f"; then
              echo "::warning file=$f::No // source: or // req: provenance comment found"
              missing=$((missing+1))
            fi
          done
          echo "Files without provenance comments: $missing"
          if [ "$missing" -gt 0 ]; then exit 1; fi

  # ---------------------------------------------------------------------------
  # req: TEST-PLAN-LOGIN §5 — dependency vulnerabilities and SBOM.
  # New scope introduced by ADR-001 (React) and ADR-LOGIN-010 (TOTP library).
  # ---------------------------------------------------------------------------
  dependencies:
    name: L2 dependency scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Generate SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/*bom*

  # ---------------------------------------------------------------------------
  # L2 — SAST (CodeQL).
  # req: HARNESS-PROCESS-STANDARD §5.4 (L2 Hook), TEST-PLAN-LOGIN §5
  #
  # VS-004 수정. 이 job 은 hooks/ci-security-auditor.yml 에만 존재하고 활성 워크플로에는
  # 없었다. 표준이 요구하는 L2 3종(시크릿·의존성·SAST) 중 SAST 가 <b>실행되지 않는</b>
  # 상태였다 — 설계 문서에는 있고 CI 에는 없는, 존재하지 않는 통제였다.
  #
  # VS-004: this job existed only in hooks/ci-security-auditor.yml and never ran. Of the three
  # L2 scans the standard mandates, SAST was documented but absent from CI.
  # ---------------------------------------------------------------------------
  sast:
    name: L2 SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL 은 분석 결과를 업로드하므로 이 권한이 필요하다. 최상위 permissions 는
      # contents:read 뿐이므로 job 단위로만 승격한다(최소 권한).
      # CodeQL uploads its results, so this is required; granted per-job to keep least privilege.
      security-events: write
    strategy:
      matrix:
        language: [java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Build (Java)
        run: mvn -B -ntp -DskipTests package
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # L2 — AI security-auditor 감사.
  # req: HARNESS-PROCESS-STANDARD §5.4, .claude/agents/security-auditor.md
  #
  # VS-004 수정. 표준 §2.4 는 "L2 AI 감사가 TODO 로 조용히 통과하지 않을 것"을 요구한다.
  # 따라서 스크립트가 등록되지 않은 상태는 <b>skip 이 아니라 실패</b>다 — 미설정을 통과로
  # 처리하면 통제가 있는 것처럼 보이면서 아무것도 검사하지 않는다.
  #
  # VS-004: §2.4 requires that the AI audit not pass silently as a TODO, so an unconfigured
  # script is a <b>failure, not a skip</b>. Treating "unset" as "pass" is a control that looks
  # present and checks nothing.
  # ---------------------------------------------------------------------------
  security-auditor-agent:
    name: L2 AI security audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Run security-auditor agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS_AI_AUDIT_SCRIPT: ${{ vars.HARNESS_AI_AUDIT_SCRIPT }}
          HARNESS_AI_AUDIT_CMD: ${{ vars.HARNESS_AI_AUDIT_CMD }}
          HARNESS_AI_AUDIT_OUTPUT: security/audit-pr-${{ github.event.pull_request.number }}.md
          HARNESS_PR_BASE_REF: ${{ github.base_ref }}
          HARNESS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${HARNESS_AI_AUDIT_CMD:-}" ] && [ -z "${HARNESS_AI_AUDIT_SCRIPT:-}" ]; then
            echo "HARNESS_AI_AUDIT_CMD 는 더 이상 직접 실행하지 않습니다."
            echo "체크인된 래퍼 스크립트를 만들고 HARNESS_AI_AUDIT_SCRIPT 로 교체하세요."
            exit 1
          fi
          if [ -z "${HARNESS_AI_AUDIT_SCRIPT:-}" ]; then
            echo "HARNESS_AI_AUDIT_SCRIPT 미설정 — AI security-auditor 감사가 TODO 상태로 통과할 수 없어 L2를 차단합니다."
            exit 1
          fi
          case "${HARNESS_AI_AUDIT_SCRIPT}" in
            *[!A-Za-z0-9._/-]*)
              echo "HARNESS_AI_AUDIT_SCRIPT 값이 안전한 파일 경로 형식이 아닙니다: ${HARNESS_AI_AUDIT_SCRIPT}"
              exit 1
              ;;
          esac
          if [ ! -f "${HARNESS_AI_AUDIT_SCRIPT}" ]; then
            echo "AI 감사 스크립트가 없습니다: ${HARNESS_AI_AUDIT_SCRIPT}"
            exit 1
          fi
          if [ ! -x "${HARNESS_AI_AUDIT_SCRIPT}" ]; then
            echo "AI 감사 스크립트에 실행 권한이 없습니다: ${HARNESS_AI_AUDIT_SCRIPT}"
            exit 1
          fi
          mkdir -p security
          echo "Running ${HARNESS_AI_AUDIT_SCRIPT}..."
          "${HARNESS_AI_AUDIT_SCRIPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: security/

  # ---------------------------------------------------------------------------
  # L2 종합 판정 — 이 job 이 실패하면 merge 를 차단한다.
  # req: HARNESS-PROCESS-STANDARD §5.4
  #
  # if: always() 로 두는 이유: 선행 job 이 실패해 skip 되면 판정 자체가 사라지고,
  # 그 부재가 통과로 읽힌다. 항상 실행해 명시적으로 판정한다.
  # Runs with always(): if it were skipped when an upstream job fails, the missing verdict
  # would read as a pass. It always runs and always states a verdict.
  # ---------------------------------------------------------------------------
  l2-verdict:
    name: L2 verdict
    runs-on: ubuntu-latest
    needs: [secrets, build, static-rules, dependencies, sast, security-auditor-agent]
    if: always()
    steps:
      - name: Verdict
        run: |
          fail=0
          for r in "${{ needs.secrets.result }}" \
                   "${{ needs.build.result }}" \
                   "${{ needs.static-rules.result }}" \
                   "${{ needs.dependencies.result }}" \
                   "${{ needs.sast.result }}"; do
            [ "$r" = "success" ] || fail=1
          done
          # AI 감사는 pull_request 에서만 실행되므로 push 에서의 skipped 는 허용한다.
          # 그 외의 skipped/failure 는 차단한다.
          # The AI audit only runs on pull_request, so 'skipped' is tolerated on push; any
          # other non-success is blocking.
          agent="${{ needs.security-auditor-agent.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$agent" != "success" ]; then
            fail=1
          fi
